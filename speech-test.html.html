<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英语朗读诊断</title><style>body{font-family:system-ui,sans-serif;max-width:650px;margin:24px auto;padding:18px;line-height:1.65;background:#f8fafc;color:#18283c}button{background:#185bd1;color:white;border:0;border-radius:10px;padding:13px 18px;font-size:16px;margin:5px 5px 5px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:14px;border:1px solid #ddd;border-radius:10px}small{color:#555}</style></head><body><h2>🔊 英语朗读诊断</h2><p>请在安卓 Chrome 中打开本页，点击“测试朗读”，然后把下面的诊断结果截图给我。</p><button id="play">▶ 测试朗读 Hello, how are you?</button><button id="voices">重新检查语音</button><button id="stop">停止</button><pre id="log">等待操作……</pre><small>只在本机检查浏览器语音接口，不上传个人数据。</small><script>const out=document.getElementById('log');let lines=[];function log(s){lines.push(new Date().toLocaleTimeString()+' '+s);out.textContent=lines.slice(-30).join('\n')}const ok='speechSynthesis'in window&&'SpeechSynthesisUtterance'in window;log('语音接口：'+(ok?'支持':'不支持'));log('浏览器：'+navigator.userAgent);function check(){if(!ok)return;const s=speechSynthesis,v=s.getVoices();log('语音数量：'+v.length);log('英语语音：'+v.filter(x=>/^en/i.test(x.lang)).map(x=>x.name+' ['+x.lang+']').join('；').slice(0,800)||'无');log('状态：speaking='+s.speaking+', pending='+s.pending+', paused='+s.paused)}if(ok){speechSynthesis.onvoiceschanged=()=>{log('voiceschanged 事件');check()};check()}document.getElementById('voices').onclick=check;document.getElementById('stop').onclick=()=>{if(ok){speechSynthesis.cancel();log('已停止')}};document.getElementById('play').onclick=()=>{if(!ok){log('设备不支持');return}try{const s=speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance('Hello, how are you?');u.lang='en-US';u.rate=.85;u.volume=1;u.onstart=()=>log('事件：onstart（已开始）');u.onend=()=>log('事件：onend（已结束）');u.onerror=e=>log('事件：onerror '+e.error);log('调用 speak()');s.speak(u);setTimeout(()=>{log('2秒后状态：speaking='+s.speaking+', pending='+s.pending+', paused='+s.paused);if(s.paused){s.resume();log('已尝试 resume()')}},2000)}catch(e){log('异常：'+e.message)}};</script></body></html>
